[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "promptforge"
version = "1.0.0"
description = "Lightweight Terminal AI Prompt Manager & Optimizer"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "PromptForge Team", email = "promptforge@example.com"},
]
keywords = ["prompt", "ai", "cli", "manager", "optimizer", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
    "Environment :: Console",
    "Operating System :: OS Independent",
]

[project.scripts]
promptforge = "promptforge.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.setuptools]
packages = ["promptforge"]

[tool.setuptools.package-data]
promptforge = []
